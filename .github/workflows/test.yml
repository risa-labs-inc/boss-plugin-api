name: Build

# Nothing compiled this repo before a merge landed: release.yml only fires on
# push to main, and the only check on a pull request was the Claude review.
#
# That gap matters more here than in a plugin. This is the API surface 36
# plugins compile against, and the binary-compatibility-validator dump under
# api/ is only verified by `apiCheck`, which `build` pulls in via `check`. A
# breaking change to the public API could land without anything objecting,
# and would surface as an unresolved reference in someone else's release.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `build` -> `check` -> `apiCheck`, so this fails when the public API
      # drifts from api/*.api without the dump being regenerated.
      - name: Build, validate API surface, and test
        run: ./gradlew build --no-daemon
        env:
          CI: 'true'
